version: 2

unit_tests:

  - name: test_runway_surface_unknown

    description: >
      Test that NULL or empty runway surface values are converted
      to __UNKNOWN__ in the intermediate runway model.

    model: int_runways

    given:

      - input: ref('stg_runways')
        rows:

          - runway_id: 1
            airport_ident: "01CN"
            runway_surface: null
            runway_length_ft: 3000
            runway_width_ft: 75

          - runway_id: 2
            airport_ident: "KJFK"
            runway_surface: ""
            runway_length_ft: 12000
            runway_width_ft: 150

          - runway_id: 3
            airport_ident: "EGLL"
            runway_surface: "ASPHALT"
            runway_length_ft: 13000
            runway_width_ft: 150

    expect:

      rows:

        - runway_id: 1
          airport_ident: "01CN"
          runway_surface: "__UNKNOWN__"

        - runway_id: 2
          airport_ident: "KJFK"
          runway_surface: "__UNKNOWN__"

        - runway_id: 3
          airport_ident: "EGLL"
          runway_surface: "ASPHALT"