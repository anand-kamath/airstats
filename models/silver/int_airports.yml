version: 2
models:
  - name: int_airports
    description: "This has the details about the airports"
    columns:
      - name: airport_ident
        description: "unique id for the airport"
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: airport_type
        description: "type of airport"
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['heliport','small_airport','closed','seaplane_base','balloonport','medium_airport','large_airport']
      - name: airport_name
        description: "name of the airport"
        data_type: string
        data_tests:
          - dbt_expectations.expect_column_distinct_count_to_be_greater_than:
              arguments:
                value: 10
      - name: airport_lat
        description: "latitude of the airport"
        data_type: numeric
      - name: airport_long
        description: "longitude of the airport"
        data_type: numeric
      - name: continent
        description: "continent in which the airport belongs to"
        data_type: string
      - name: iso_country
        description: "country in which the airport belongs to"
        data_type: string
      - name: iso_region
        description: "region in which the airport belongs to"
        data_type: string
